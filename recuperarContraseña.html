<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="styleContraseña.css">
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="icono">
                🔒
            </div>

            <h1>¿Olvidaste tu contraseña?</h1>

            <p>
                Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un codigo para restablecer tu contraseña.
            </p>

            <form>

                <div class="campo">

                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required>

                </div>

                <button type="submit" class="btn-enviar">
                    Enviar codigo 
                </button>

            </form>

            <div class="volver">

                <a href="index.html">
                    ← Volver al inicio de sesión
                </a>

            </div>

        </div>

    </div>

</body>

</html>
